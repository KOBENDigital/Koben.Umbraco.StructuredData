name: Release

# Publishes to nuget.org via Trusted Publishing (OIDC): no long-lived API key is stored anywhere.
# One-time setup, documented under "Releasing" in README.md:
#   nuget.org  → Trusted Publishing → policy for KOBENDigital / Koben.Umbraco.StructuredData /
#                release.yml / environment "nuget"
#   GitHub     → repository secret NUGET_USER = the nuget.org profile name that owns the policy
# To release: bump <Version> in the csproj and "version" in umbraco-package.json, commit, then
#   git tag vX.Y.Z && git push origin vX.Y.Z

on:
  push:
    tags: ["v*"]

env:
  CLIENT_DIR: src/Koben.Umbraco.StructuredData/Client
  PROJECT: src/Koben.Umbraco.StructuredData/Koben.Umbraco.StructuredData.csproj

jobs:
  publish:
    name: Pack and publish to nuget.org
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: write # create the GitHub release
      id-token: write # let nuget.org verify this workflow via GitHub OIDC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/Koben.Umbraco.StructuredData/Client/package-lock.json

      - name: Check the tag matches the package version
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$PROJECT")
          MANIFEST=$(node -p "require('./$CLIENT_DIR/public/umbraco-package.json').version")
          echo "tag=$GITHUB_REF_NAME csproj=$VERSION umbraco-package.json=$MANIFEST"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match <Version>$VERSION</Version> in the csproj"; exit 1
          fi
          if [ "$MANIFEST" != "$VERSION" ]; then
            echo "::error::umbraco-package.json version $MANIFEST does not match csproj version $VERSION"; exit 1
          fi

      - name: Build client bundle
        working-directory: ${{ env.CLIENT_DIR }}
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      # Default UmbracoVersion = the supported floor; that is what the nupkg's dependency range starts at.
      - name: Build and pack
        run: |
          dotnet build "$PROJECT" -c Release -p:SkipClientBuild=true -p:ContinuousIntegrationBuild=true
          dotnet pack "$PROJECT" -c Release --no-build -o artifacts -p:SkipClientBuild=true \
            -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg
          ls -l artifacts

      # Request the temporary key right before the push: it is valid for one hour and single-use.
      - name: NuGet login (OIDC → temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg
          --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
